<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/recording.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    
    <title>MeetingSummarizer</title>
  </head>
  <body>
    <input type="checkbox" id="sidebar-active">
    <nav>
      <div class="btn-enter-menu-container">
        <label for="sidebar-active" class="label-enter-menu">
          <div class="btn-enter-menu">
            <span class="material-symbols-outlined">menu</span>
          </div> 
        </label>
      </div>
      <img src="../assets/icons/meeting-summarizer-logo.svg" alt="meeting-summarizer-logo">
    </nav>
    
    <div class="sidebar">
      <header>
        <span>Menu</span>
        <label for="sidebar-active" class="label-exit-menu">
          <i class="bi bi-x-lg"></i>
        </label>
      </header>
      <ul>
        <li>
          <a href="recording.html">
            <i class="bi bi-record-circle"></i>
            <span>Recording</span>
          </a>
        </li>
        <li>
          <a href="summaries.html">
            <i class="bi bi-files"></i>
            <span>Summaries</span>
          </a>
        </li>
        <li>
          <a href="profile.html">
            <i class="bi bi-person"></i>
            <span>Profile</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="main-content">
      <div class="recording-container">
        <div class="recording-support">
          <h1>Recording</h1>
          <input placeholder="Title">
          <div class="timer-display">
            00: 00: 00
          </div>
          <div class="buttons-sector">
            <button class="btn-start-recording">
              <span class="material-symbols-outlined">radio_button_checked</span>
              <span class="btn-name">Start</span>
            </button>
            <button class="btn-stop-recording">
              <span class="material-symbols-outlined">stop_circle</span>
              <span class="btn-name">Stop</span>
            </button>
            <button class="btn-start-thread">
              <span class="material-symbols-outlined">monitoring</span>
              <span class="btn-name">Start thread</span>
            </button>
          </div>
        </div>

        <div class="recording-planning">
          <h1>Scheduling recording</h1>
          <div class="input-container" id="first-input-container">
            <input type="text" placeholder="Start date and time" data-input> <!-- input is mandatory -->
          
            <a class="input-button" title="toggle" data-toggle>
              <span class="material-symbols-outlined">today</span>
            </a>
            
            <a class="input-button" title="clear" data-clear>
              <span class="material-symbols-outlined">close</span>
            </a>
          </div>
          
          <div class="input-container" id="second-input-container">
            <input type="text" placeholder="End date and time" data-input> <!-- input is mandatory -->
          
            <a class="input-button" title="toggle" data-toggle>
              <span class="material-symbols-outlined">event</span>
            </a>
            
            <a class="input-button" title="clear" data-clear>
              <span class="material-symbols-outlined">close</span>
            </a>
          </div>

          <div class="input-container" id="third-input-container">
            <input type="text" placeholder="Title">
          </div>

          <button>
            <span class="material-symbols-outlined">add_to_queue</span>
            <span>Add to list</span>
          </button>

        </div>
      </div>

      <div class="recording-plan-list">
        <h1>List of planned recordings</h1>
        <div class="scrollbox">
          
        </div>
        
        <ul id="context-menu">
          <li class="delete-recording">
            <span class="material-symbols-outlined">delete</span>
            <span>Delete</span>
          </li>
          <li>
            <span class="material-symbols-outlined">close</span>
            <span>Close</span>
          </li>
        </ul>
      </div>
        
        
    </div>
    
    <script type="module" src="../scripts/timer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../scripts/scheduling.js"></script>
    <script type="module" src="../scripts/list.js"></script>
    <script type="module" src="../scripts/handle-recording.js"></script>
    
  </body>
</html>
