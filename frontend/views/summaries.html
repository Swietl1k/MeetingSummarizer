<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/summaries.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    
    <title>MeetingSummarizer</title>
  </head>
  <body>
    <input type="checkbox" id="sidebar-active">
    <nav>
      <div class="btn-enter-menu-container">
        <label for="sidebar-active" class="label-enter-menu">
          <div class="btn-enter-menu">
            <span class="material-symbols-outlined">menu</span>
          </div> 
        </label>
      </div>
      <img src="../assets/icons/meeting-summarizer-logo.svg" alt="meeting-summarizer-logo">
    </nav>
    
    <div class="sidebar">
      <header>
        <span>Menu</span>
        <label for="sidebar-active" class="label-exit-menu">
          <i class="bi bi-x-lg"></i>
        </label>
      </header>
      <ul>
        <li>
          <a href="recording.html">
            <i class="bi bi-record-circle"></i>
            <span>Recording</span>
          </a>
        </li>
        <li>
          <a href="summaries.html">
            <i class="bi bi-files"></i>
            <span>Summaries</span>
          </a>
        </li>
        <li>
          <a href="profile.html">
            <i class="bi bi-person"></i>
            <span>Profile</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="content">
      <div class="main-content">

      </div>
      
      <ul id="context-menu">
        <li class="open-summary">
          <span class="material-symbols-outlined">open_in_browser</span>
          <span>Open</span>
        </li>
        <li class="delete-summary">
          <span class="material-symbols-outlined">delete</span>
          <span>Delete</span>
        </li>
      </ul>
   
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../scripts/summaries.js"></script>
  
  </body>
